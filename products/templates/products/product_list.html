<!DOCTYPE html>
<html>
    <head>
    <title>Products List</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f4f4f4;
        }

        h1 {
            color: #333;
        }
        
        input, button {
            padding: 10px;
            margin: 5px;
            
        }

        table{
            
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #222;
            color: white;
        }

    </style>
    </head>

    <body>

        <h1>E-commerce Products</h1>

        <form method="GET">
            <input
                type="text"
                name="q"
                placeholder="Search products..."
                value="{{ request.GET.q }}"
            >

            <button type="submit">Search</button>
            <a href="{% url 'product_list' %}">Clear</a>

        </form>

        <table>
            <tr>
                <th>Product Name</th>
                <th>Price</th>
                <th>Description</th>
            </tr>

            {% for product in products %}
        <tr>
            <td>{{ product.name }}</td>
            <td>{{ product.price }}</td>
            <td>{{ product.description }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">No products found.</td>
        </tr>
        {% endfor %}
        
        </table>



    </body>





</html>
